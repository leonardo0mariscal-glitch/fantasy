<style>
/* Layout idea: one phone column on a light-gray field; frosted white glass cards; black buttons and accents. */
:root{
  --ink:#0c0c0e; --bg:#e3e4e7; --text:#101012; --mut:#6a6d75;
  --line:rgba(0,0,0,.09);
  --amber:#101012; --good:#101012; --warn:#4a4c52; --bad:#101012;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;
  background-image:linear-gradient(115deg,#f4f5f7 0%,#d2d4d9 22%,#f1f2f4 38%,#aeb1b8 58%,#eceef0 74%,#c3c5cb 100%);
  background-attachment:fixed;position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:14px}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 50%,rgba(255,255,255,.26));border:1px solid rgba(255,255,255,.55);border-radius:26px;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.4),inset 1.5px 0 1px rgba(255,255,255,.5),inset -1.5px 0 1px rgba(255,255,255,.3),0 10px 32px rgba(30,32,40,.14);-webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.06);backdrop-filter:blur(14px) saturate(190%) brightness(1.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(255,255,255,.35) 100%);opacity:.7}
.av{position:relative;width:44px;height:44px;flex:none;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(170,173,181,.8));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 1px #fff,0 3px 8px rgba(0,0,0,.15);display:grid;place-items:center;font:700 14px var(--display);color:#3a3b41;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#d4d5da}
.av.sm{width:34px;height:34px;font-size:12px}
.slot{width:36px!important}
.card{padding:16px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:21px}
h3{font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.btn{font:700 14px var(--body);color:#fff;background:linear-gradient(180deg,#3a3b41,#0c0c0e);border:0;border-radius:14px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);white-space:nowrap}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.arrow:focus-visible{outline:2px solid #0c0c0e;outline-offset:2px}
.btn.ghost{background:rgba(255,255,255,.7);color:#0c0c0e;border:1px solid rgba(0,0,0,.1);padding:10px 14px;font-size:16px;box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,0,0,.1)}
.btn[disabled]{opacity:.5;cursor:default}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .big{font-size:46px;line-height:1}
.stat .lab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.gap{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.75);white-space:nowrap}
.pill.O{background:#0c0c0e;color:#fff;border-color:#0c0c0e}
.pill.DTD{background:transparent;border:1px dashed #4a4c52}
.pill.good{background:#d8d9dd}
.pill.amber{background:#c4c6cb}
.slot{width:42px;flex:none;text-align:center;font:700 13px var(--display);letter-spacing:.04em;padding:6px 0;border-radius:10px;background:#0c0c0e;color:#fff}
.slot.BE{background:rgba(0,0,0,.08);color:var(--mut)}
.slot.IR{background:transparent;border:1px dashed #8d9098;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--mut)}
.val{font:700 20px var(--display);text-align:right;min-width:46px;font-variant-numeric:tabular-nums}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arrow{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--text);font-size:20px;cursor:pointer}
.arrow[disabled]{opacity:.35;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--text);cursor:pointer}
.chip.on{background:#0c0c0e;color:#fff;border-color:#0c0c0e}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips.sc::-webkit-scrollbar{display:none}
.chips.sc .chip{flex:0 0 auto}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#a3a5ac,#5a5c63);border-radius:99px}
.bar.me>i{background:linear-gradient(90deg,#2c2d32,#0c0c0e)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav .glass{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:26px;width:100%;max-width:560px}
.tab{flex:1;min-width:0;font:600 11.5px var(--body);padding:10px 1px;border-radius:20px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.tab.on{background:#0c0c0e;color:#fff}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.note{font-size:12px;color:var(--mut)}
.warnbox{border-left:3px solid #0c0c0e;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:10px;font-size:13px}
.ai{white-space:normal;font-size:14.5px}
.ai p{margin:0 0 10px}.ai ul{margin:0 0 10px;padding-left:20px}.ai strong{color:var(--ink)}
.ai h4{font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:#0c0c0e}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.wk{border-collapse:collapse;font-size:12px;width:100%;min-width:430px}
table.wk th,table.wk td{padding:7px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
table.wk th{font-weight:600;color:var(--mut);border-top:0;line-height:1.2}
table.wk td:first-child,table.wk th:first-child{text-align:left;position:sticky;left:0;background:#f1f1f3;z-index:1;max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.wk .y{font-weight:700}
table.wk .n{color:#b4b6bc}
table.wk .lk{text-decoration:line-through;color:var(--mut)}
.right{text-align:right}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:transform .12s}.btn:active,.chip:active{transform:scale(.97)}}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:rgba(0,0,0,.04)}
.chev{color:var(--mut);font-size:22px;padding-left:2px}
#sheet{position:fixed;inset:0;z-index:50;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;background:linear-gradient(115deg,#f4f5f7 0%,#d2d4d9 22%,#f1f2f4 38%,#aeb1b8 58%,#eceef0 74%,#c3c5cb 100%)}
#sheet.open{display:block}
@media (prefers-reduced-motion:no-preference){#sheet.open .wrap{animation:shin .22s ease-out}@keyframes shin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
.shbar{display:flex;align-items:center;gap:12px}
ul.why,ol.why{margin:8px 0 0;padding-left:20px;font-size:14px}
.verdict{margin:12px 0 0;font-size:16px;line-height:1.35}ul.why li,ol.why li{margin:0 0 8px}
.chip.auto{border-style:dashed}
.chip.sm{font-size:12px;padding:5px 11px}
.trbar{position:sticky;top:8px;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 12px;border-radius:18px;background:#ecedf0;border:1px solid rgba(0,0,0,.1);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.trbar .grow{overflow-wrap:anywhere}
.sbox{width:100%;box-sizing:border-box;font:500 16px var(--body);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.sbox:focus{border-color:#0c0c0e;box-shadow:0 0 0 3px rgba(12,12,14,.1)}
.dim{opacity:.55}
.val .sub{font:600 11px var(--body);color:var(--mut);letter-spacing:0}
.hero.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero.three .stat .big{font-size:clamp(28px,9.2vw,42px)}
.hero.three .stat .lab{font-size:10.5px;letter-spacing:.03em}
.hero.three .stat .note{font-size:11px}

/* ---------- ajuste chico por rival (máx ±4%): lo que permite el rival y el ritmo del juego, con datos de ESPN ---------- */
function tmLg(){const T=S.tm;if(!T)return 0;if(T._lg)return T._lg;const v=Object.values(T).filter(Array.isArray).map(x=>x[0]);return T._lg=v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
let _mc=null,_mcS=null;
function mf(p,day){
  if(_mcS!==S||!_mc){_mc=new Map();_mcS=S}
  const k=p.t+'|'+day; let r=_mc.get(k); if(r!==undefined)return r;
  r=1;
  const T=S.tm,lg=tmLg(), g=T&&lg?game(p.t,day):null;
  if(g){
    const a=T[p.t], b=T[g.opp.replace(/^(vs |@)/,'')];
    if(Array.isArray(a)&&Array.isArray(b))r=Math.max(0.96,Math.min(1.04,1+0.5*(b[1]/lg-1)+0.3*((b[0]+b[1])/(a[0]+a[1])-1)));
  }

}
/* ---------- alineación de un día con candados ----------
   Como bestDay, pero: los titulares que ya empezaron no se mueven y los de banca que ya empezaron no suben;
   se puede forzar (force) o vetar (exclude) a jugadores; y entre alineaciones igual de buenas prefiere la que mueve menos gente (stay). */
let _dpA=null,_dpB=null,_chB=new Int8Array(0);
function planDay(R,day,o){
  o=o||{}; const today=day===todayKey(), ex=o.exclude||new Set(), fo=o.force||new Set();
  const used=SLOTS.map(()=>false), fixed=[], pool=[];
  for(const p of R){
    if(p.slot==='IR'||p.slot==='BE')continue;
    const g=game(p.t,day); if(!g||!today||!started(day,g.time))continue;
    const i=SLOTS.findIndex((s,k)=>s[0]===p.slot&&!used[k]);
    if(i>=0){used[i]=true;fixed.push({p,slot:p.slot,v:p.e*avail(p)*mf(p,day),locked:true})}
  }
  const fx=new Set(fixed.map(x=>x.p.n));
  for(const p of R){
    if(p.slot==='IR'||fx.has(p.n)||ex.has(p.n))continue;
    const g=game(p.t,day); if(!g)continue;
    if(today&&started(day,g.time))continue;
    if(p.from&&day<p.from)continue;
    const v=p.e*avail(p)*mf(p,day); if(v<=0)continue;
    pool.push({p,v,sl:slotsFor(p).filter(i=>!used[i])});
  }
  const M=1<<SLOTS.length, n=pool.length;
  if(!_dpA){_dpA=new Float64Array(M);_dpB=new Float64Array(M)}
  if(_chB.length<n*M)_chB=new Int8Array(n*M);
  let dp=_dpA, nd=_dpB; dp.fill(-1); dp[0]=0;
  for(let i=0;i<n;i++){
    const x=pool[i], bon=fo.has(x.p.n)?1000:0, base=i*M, sl=x.sl;
    nd.set(dp); _chB.fill(-2,base,base+M);

      for(let k=0;k<sl.length;k++){ const s=sl[k]; if(m&(1<<s))continue; const nm=m|(1<<s), v=dp[m]+x.v+bon+((o.stay&&x.p.slot===SLOTS[s][0])?0.01:0); if(v>nd[nm]){nd[nm]=v;_chB[base+nm]=s;} } }

  const assign=[...fixed]; let m=bm;

}
/* mejor alineación de un día, solo el total: como el valor de un jugador no depende del espacio, basta meter a los mejores

const _fo=new Int8Array(SLOTS.length),_fs=new Uint8Array(SLOTS.length);

function fastDay(R,day){
  const c=[];
  for(const p of R){
    if(p.slot==='IR')continue;
    if(!game(p.t,day))continue;
    if(p.from&&day<p.from)continue;
    const v=p.e*avail(p)*mf(p,day); if(v<=0)continue;
    c.push({v,sl:slotsFor(p)});
  }
  c.sort((a,b)=>b.v-a.v); _fo.fill(-1);
  let tot=0,n=0;
  for(let i=0;i<c.length&&n<SLOTS.length;i++){_fs.fill(0);if(_aug(i,c)){tot+=c[i].v;n++}}

/* qué cambiar en tu alineación de un día: quién sube, quién pasa de espacio, a quién sentar y por quién */
function lineupPlan(R,day){
  const today=day===todayKey(), g=p=>game(p.t,day);
  const val=p=>g(p)?p.e*avail(p)*mf(p,day):0, plays=p=>!!g(p)&&avail(p)>0;
  const lock=p=>!!(today&&g(p)&&started(day,g(p).time));
  const starters=R.filter(p=>p.slot!=='BE'&&p.slot!=='IR');
  const curTot=starters.reduce((a,p)=>a+val(p),0);
  const opt=planDay(R,day,{stay:true}), to=new Map(opt.assign.map(a=>[a.p.n,a.slot]));
  const occ={},cnt={}; starters.forEach(p=>{occ[p.slot]=(occ[p.slot]||0)+1}); SLOTS.forEach(s=>{cnt[s[0]]=(cnt[s[0]]||0)+1});
  const empty=[]; for(const k in cnt)for(let i=occ[k]||0;i<cnt[k];i++)empty.push(k);
  const ups=[],shifts=[],sits=[],frees=[],idle=[];
  for(const p of R){
    if(p.slot==='IR')continue;
    const isS=p.slot!=='BE', t=to.get(p.n);
    if(!isS){ if(t&&!lock(p))ups.push({p,to:t,v:val(p)}); else if(!t&&plays(p)&&!lock(p))idle.push({p,v:val(p)}); }
    else if(t&&t!==p.slot)shifts.push({p,from:p.slot,to:t,v:val(p)});
    else if(!t&&!lock(p))(plays(p)?sits:frees).push({p,v:val(p),from:p.slot});
  }
  /* ¿por quién sentar? lo que cuesta sentar a cada titular para poder meter a b */
  const sitOptions=b=>{
    const T0=planDay(R,day,{force:new Set([b.n])}).tot, o=[];
    for(const s of starters){ if(lock(s)||s.n===b.n)continue;
      const T=planDay(R,day,{force:new Set([b.n]),exclude:new Set([s.n])}).tot;
      o.push({p:s,loss:Math.max(0,T0-T),v:val(s),plays:plays(s)}); }
    return o.sort((a,c)=>a.loss-c.loss||a.v-c.v);
  };
  const free=SLOTS.length-opt.assign.length;
  return {curTot,optTot:opt.tot,gain:opt.tot-curTot,opt,to,empty,ups,shifts,sits,frees,idle,free,sitOptions,lock,val,plays};
}

/* ---------- agentes libres por día: huecos de tu alineación, quién los llena y a quién soltar ---------- */
let _fp=null,_fpS=null;

  for(const a of [...S.fa,...(S.fs||[])]){if(seen.has(a[0]))continue;seen.add(a[0]);const p=mkF(a);p.owner=0;out.push(p)}

const dsh=k=>{const [m,d]=k.split('-').map(Number);return WD[new Date(Date.UTC(2026,m-1,d)).getUTCDay()]+' '+d};
const dayName=k=>k===todayKey()?'Hoy':dsh(k);

  const g=game(f.t,day); if(!g||started(day,g.time))return null;
  if(f.ws==='W'&&day<NS())return null;
  return avail(f)>0?g:null;
}
function dayFill(R,day){       // cuántos de tus 10 espacios quedan con jugador ese día, cuáles faltan y cuántos juegan pero no caben

/* agregar a f y soltar a d (o a nadie si tienes lugar libre): lo que cambia ese día y en total */

  const rows=[]; let net=0,gD=0,starts=0;
  for(const day of hd){
    if(!game(f.t,day)&&!(d&&game(d.t,day)))continue;          // si ninguno de los dos juega, nada cambia
    if(bt[day]==null)bt[day]=planDay(R,day).tot;
    const P1=planDay(R1,day), diff=P1.tot-bt[day], sf=P1.assign.some(x=>x.p.n===f.n);

/* sueltables (ni protegidos ni IR) de menor a mayor costo: cuánto pierdes en el periodo si los sueltas sin meter a nadie */
function dropOrder(R,AP,keep,ctx){

  ctx.loss=ds.map(d=>{let l=0;const R1=R.filter(x=>x.n!==d.n);
    for(const day of hd){if(!game(d.t,day))continue;if(ctx.bt[day]==null)ctx.bt[day]=planDay(R,day).tot;l+=ctx.bt[day]-planDay(R1,day).tot}

/* para cada agente, a quién soltarías: primero el mejor jugador sacrificable (rinde menos que lo que hay libre);

  const repl=replLevel(), open=R.filter(p=>p.slot!=='IR').length<13, hd=ctx.hd;

  return fas.map(f=>{
    const fe=f.e*avail(f);
    if(open){const c=evalPair(R,f,null,D,hd,ctx.bt);c.sac=true;return c}
    let order=dropOrder(R,AP,keep,ctx);
    if(!ctx.sd)ctx.sd=new Map();

/* todo lo que depende de tu roster, tus protegidos, el % de día a día y la hora: se recalcula solo cuando algo de eso cambia */

function epoch(){

const MAXC=16;
function dayCands(D,filtered){

/* huecos de la semana: por día, cuántos de tus 10 espacios llenas, cuántos faltan y cuántos sobran */
function gapCard(R){
  const hdC=hdays('c'), hdN=hdays('n'), fills={}, TD=todayKey();
  [...hdC,...hdN].forEach(d=>{fills[d]=dayFill(R,d)});
  const over=d=>d===TD&&!(S.sched[d]||[]).some(g=>!started(d,g.split(' ')[1]));      // hoy, cuando ya empezaron todos los partidos
  const row=d=>{const F=fills[d];
    const a=!F.nba?'<span class="mut">sin partidos</span>':over(d)?'<span class="mut">ya empezaron</span>':[F.empty.length?`<b style="color:var(--amber)">faltan ${F.empty.length}</b>`:'<span class="mut">completo</span>',F.surplus?`<span class="mut">sobran ${F.surplus}</span>`:''].filter(Boolean).join(' · ');
    return `<div class="row tap" data-goad="${d}" style="padding:6px 0"><div style="width:62px" class="note">${esc(dayName(d))}</div><div class="grow"><div class="bar ${F.filled<10?'':'me'}"><i style="width:${Math.max(3,F.filled*10)}%"></i></div></div><div class="num" style="width:44px;text-align:right"><b>${F.nba?F.filled:'–'}</b>/10</div><div style="width:104px;text-align:right"><div class="note">${a}</div>${F.nba?`<div class="note mut">${F.nba} ${F.nba===1?'partido':'partidos'} NBA</div>`:''}</div></div>`};
  const live=[...hdC,...hdN].filter(d=>fills[d].nba&&!over(d)), big=live.filter(d=>fills[d].nba>=5&&fills[d].empty.length>=2);
  const sob=live.reduce((a,d)=>a+fills[d].surplus,0), thin=live.filter(d=>fills[d].nba<5&&fills[d].empty.length>=2);
  const worst=big.slice().sort((a,b)=>fills[b].empty.length-fills[a].empty.length||(a<b?-1:1)).slice(0,3);
  let sum='';
  if(worst.length)sum+=`Los días con más huecos y con partidos suficientes: ${worst.map(d=>`<b>${esc(dayName(d).toLowerCase())}</b> (faltan ${fills[d].empty.length})`).join(', ')}. Ahí un agente te suma más. `;
  if(thin.length)sum+=`En los días con pocos partidos en la NBA (${thin.slice(0,3).map(d=>esc(dayName(d).toLowerCase())+' '+fills[d].nba).join(', ')}) te quedas corto tú y todos los demás. `;
  sum+=sob>0?`Te sobran ${sob} ${sob===1?'jugador sentado que sí juega':'jugadores sentados que sí juegan'}: ahí puedes soltar a alguien sin perder puntos.`:'No te sobra nadie sentado: no hay jugadores de más en tu roster.';
  return `<div class="glass card"><h3>Huecos de la semana</h3>
    <div class="note" style="margin:6px 0 8px">Cada día tienes 10 espacios. Se pierden puntos de dos formas: espacios vacíos (nadie que juegue) y jugadores que sí juegan pero no caben. Lo ideal es 10 que jueguen cada día. Toca un día para ver los agentes que juegan ese día.</div>
    ${hdC.map(row).join('')}
    <details style="margin-top:6px"><summary class="note" style="cursor:pointer">Semana siguiente</summary>${hdN.map(row).join('')}</details>
    <div class="note" style="margin-top:8px">${sum}</div></div>`;
}

function dayView(){
  const D=days(), day=D[st.di], me=team(S.me), R=roster(me);
  const P=day>=todayKey()?lineupPlan(R,day):null;
  const cur=R.filter(p=>p.slot!=='BE'&&p.slot!=='IR');
  let curTot=0,curN=0; for(const p of cur){ if(game(p.t,day)){curTot+=p.e*avail(p);curN++;} }
  const real=[...R].sort((a,b)=>ORDER.indexOf(a.slot)-ORDER.indexOf(b.slot));
  const all=[...real,...(P?P.empty.map(k=>({empty:true,slot:k})):[])].sort((a,b)=>ORDER.indexOf(a.slot)-ORDER.indexOf(b.slot));
  const rows=all.map(p=>{
    if(p.empty){
      const who=P?[...P.ups,...P.shifts].filter(x=>x.to===p.slot).map(x=>x.p.n):[];
      return `<div class="item dim"><div class="slot ${p.slot}">${p.slot}</div><div class="av sm">–</div><div class="grow"><div class="nm">Espacio vacío</div>
      <div class="meta">${who.length?'Lo cubre '+esc(who[0])+' en el plan de abajo':'Nadie de tu roster puede ocuparlo hoy'}</div></div><div class="val"><span class="mut">–</span></div></div>`;
    }
    const g=game(p.t,day), lock=g&&started(day,g.time);
    let tag='';
    if(P&&!lock){
      const up=P.ups.find(x=>x.p.n===p.n), sh=P.shifts.find(x=>x.p.n===p.n);
      if(up) tag=`<span class="pill good">Sube a ${up.to}</span>`;
      else if(sh) tag=`<span class="pill">Pasa a ${sh.to}</span>`;
      else if(P.sits.some(x=>x.p.n===p.n)) tag='<span class="pill amber">Siéntalo</span>';
      else if(P.idle.some(x=>x.p.n===p.n)) tag='<span class="pill amber">No cabe hoy</span>';
    }
    const q=gameState(p,day,g), act=dayPts(me,day,p.id), none='<span class="mut">–</span>';
    let vh;
    if(q.s==='none') vh=none;
    else if(st.rmode==='live') vh=(act!=null&&(q.s==='in'||q.s==='post'))?fp(act):none;
    else if(q.s==='post') vh=act!=null?fp(act):none;
    else if(q.s==='in'&&act!=null) vh='≈'+f0(liveProj(p,act,q.f))+`<div class="sub">lleva ${fp(act)}</div>`;
    else vh='≈'+f0(p.e*avail(p));
    let est=lock?' · ya empezó':'';
    if(q.gs&&q.s==='in') est=' · '+(q.gs.p>4?'OT':'Q'+q.gs.p)+' '+esc(q.gs.c);
    else if(q.gs&&q.s==='post') est=' · final';
    else if(q.gs&&q.s==='pre') est='';
    return `<div class="item tap" data-pl="${esc(p.n)}"><div class="slot ${p.slot}">${p.slot}</div>${av(p)}<div class="grow"><div class="nm">${esc(p.n)} ${badge(p.inj)}</div>
      <div class="meta">${p.t} · ${p.pos} · ${g?esc(g.opp)+' '+tm12(g.time)+est:'sin partido'} ${tag}</div></div>
      <div class="val">${vh}</div></div>`}).join('');
  const sw=P?(P.gain>=0.4?`<div class="note" style="margin-top:8px">Con la mejor alineación esperas ≈${f0(P.optTot)} pts (+${f0(P.gain)} contra la actual). Los cambios están abajo.</div>`:`<div class="note" style="margin-top:8px">Tu alineación actual ya es la mejor que veo para este día: ≈${f0(P.curTot)} pts esperados con ${curN} titulares jugando.</div>`):`<div class="note" style="margin-top:8px">Día ya jugado.</div>`;
  return `<div class="glass card"><div class="dayhead"><button class="arrow" id="prev" aria-label="Día anterior" ${st.di===0?'disabled':''}>‹</button>
    <div style="text-align:center"><h2>${dl(day)}</h2><div class="note">${(S.sched[day]||[]).length} partidos NBA${day===todayKey()?' · hoy':''}</div></div>
    <button class="arrow" id="next" aria-label="Día siguiente" ${st.di===D.length-1?'disabled':''}>›</button></div>${sw}</div>
    ${P?lineupCard(R,day,P):''}
    <div class="glass card"><h3>Roster</h3>
    <div class="chips" style="margin-top:8px"><button class="chip sm ${st.rmode==='live'?'on':''}" data-rm="live">Live</button><button class="chip sm ${st.rmode==='exp'?'on':''}" data-rm="exp">Puntos esperados</button></div>
    <div class="note" style="margin-top:6px">${st.rmode==='live'?(team(S.me).pd?'Puntos reales de ESPN de este día. Un guión es que aún no juega (o no tiene partido).':'Aún no llegan los puntos en vivo: el robot los empieza a leer en su próxima vuelta.'):'Lo que se espera que termine cada uno. En partidos en curso se corrige con lo que ya lleva.'}</div>
    <div style="margin-top:6px">${rows}</div>
</div>`;
}

function agentsView(){
  const hdAll=hdOf('b'), TD=todayKey(); if(st.ad&&!hdAll.includes(st.ad))st.ad=null;
  const D=st.ad, hd=horizon('n');
  const chips=['ALL','PG','SG','SF','PF','C'].map(p=>`<button class="chip ${st.pos===p?'on':''}" data-pos="${p}">${p==='ALL'?'Todos':p}</button>`).join('');
  const dchips=`<div class="chips sc" style="margin-bottom:10px"><button class="chip ${D?'':'on'}" data-ad="">Semana ${S.mu+1}</button>${hdAll.map(d=>`<button class="chip ${D===d?'on':''}" data-ad="${d}">${d===TD?'Hoy':dsh(d)}</button>`).join('')}</div>`;
  const filt=`<div class="chips">${chips}</div><div class="chips" style="margin-top:8px"><button class="chip ${st.hide?'on':''}" id="hide">Ocultar lesionados</button></div>`;
  if(D){
    const head=`<div class="glass card"><h3>Agentes libres</h3><div class="note" style="margin:6px 0 10px">Elige un día para ver solo los agentes que juegan ese día (sin los que ya empezaron ni los que siguen en waivers). Cada uno se mide contra el jugador al que tendrías que soltar.</div>${dchips}${filt}</div>`;
    if(!dayReady(D)){
      clearTimeout(window.__dc);window.__dc=setTimeout(()=>{try{dayAnalysis(D)}catch(_){}if(st.tab==='agents'&&st.ad===D)render()},30);
      return head+`<div class="glass card"><div class="note">Calculando quién te conviene ese día…</div></div>`;
    }
    const A=dayAnalysis(D), L=dayList(D), when=D===TD?'hoy':dl(D);
    const list=(A.fill.nba&&!A.late)?`<div class="glass card"><h3>Juegan ${esc(when)}</h3><div class="note" style="margin:6px 0 4px">Los ${MAXC} que más rinden ese día. "Hoy" es lo que te suma ese día; "neto" es lo que te suma o te cuesta en 2 semanas contando al que sueltas. Toca uno para el desglose.</div>${L.map(e=>faDayRow(e,D)).join('')||`<div class="mut" style="margin-top:8px">${st.pos!=='ALL'||st.hide?'No hay agentes con ese filtro.':'No hay agentes libres que valgan la pena ese día.'}</div>`}</div>`:'';
    return head+dayCard(D,A)+list;
  }
  let L=S.fa.map(mkF).map(f=>({f,g:gamesIn(f.t,hd),sun:game(f.t,END())?1:0}));
  L.forEach(x=>{x.v=x.f.e*avail(x.f)*x.g});

    if(!out.size&&!inn.length)continue;

    c.sort((a,b)=>b.l.e*b.l.avl-a.l.e*a.l.avl);const x=c[0],y={...x,ir:true,w:{...x.w,slot:'IR'}};
    E=E.map(e=>e===x?y:e);toIR.push(x.n);
  }
  while(nonIR(E)>cap){
    const est=e=>T.lossL[e.n]!=null?T.lossL[e.n]:(extra[e.n]!=null?extra[e.n]:0);
    const c=E.filter(e=>!e.ir&&!prot.has(e.n)).sort((a,b)=>est(a)-est(b)).slice(0,3);
    if(!c.length)break;
    let best=null;for(const e of c){const E2=E.filter(x=>x!==e),v=tvL(E2);if(!best||v>best.v)best={e,v,E2}}
    drops.push(best.e);E=best.E2;
  }
  while(nonIR(E)<T.n0){
    const have=new Set(E.map(e=>e.n)),b0=tvL(E);let best=null;
    for(const x of T.rg){if(have.has(x.f.n))continue;const v=tvL(E.concat([x.f]));if(!best||v>best.v)best={f:x.f,v}}
    if(!best||best.v-b0<0.05)break;
    adds.push(best.f);E=E.concat([best.f]);
  }
  return {E,drops,adds,toIR,bad:nonIR(E)>cap};
}
/* qué tan justo lo ve él: lo que recibe (lo mío) entre lo que da (lo suyo), por tres criterios */
function trRho(G,Q){
  const o={s:0,r:0,m:0,min:9};
  for(const v of ['s','r','m']){
    let a=0,mn=1e9,b=0;
    for(const e of G){const x=e.pv[v];a+=x;if(x<mn)mn=x}
    if(G.length>Q.length)a-=0.25*mn;                    // si recibe más cuerpos de los que da, tiene que soltar a alguien: el último vale menos
    for(const e of Q)b+=e.pv[v];
    const r=b>0?a/b:9;o[v]=r;if(r<o.min)o.min=r;
  }
  return o;
}
const trSubsets=arr=>{const o=arr.map(x=>[x]);for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)o.push([arr[i],arr[j]]);return o};
function trProx(A,B,P,G,Q){
  let myW=0,myL=0,frW=0,frL=0;
  for(const q of Q){const a=P.qa[q.n];myW+=a.w;myL+=a.l;frW-=B.lossW[q.n];frL-=B.lossL[q.n]}
  for(const g of G){const a=P.ga[g.n];frW+=a.w;frL+=a.l;myW-=A.lossW[g.n];myL-=A.lossL[g.n]}
  let dd=Q.length-G.length;
  if(dd>0){for(const c of A.cheap){if(dd<=0)break;if(G.some(g=>g.n===c.n))continue;myW-=c.w;myL-=c.l;dd--}}
  else if(dd<0){for(let i=0;i<-dd&&i<A.rg.length;i++){myW+=A.rg[i].gW;myL+=A.rg[i].gL}}
  let de=G.length-Q.length;
  if(de>0){for(const c of B.cheap){if(de<=0)break;if(Q.some(q=>q.n===c.n))continue;frW-=c.w;frL-=c.l;de--}}
  else if(de<0){for(let i=0;i<-de&&i<B.rg.length;i++){frW+=B.rg[i].gW;frL+=B.rg[i].gL}}
  return {myW,myL,frW,frL};
}
const accLv=(rho,out)=>{let lv=rho>=1.03?3:rho>=0.98?2:rho>=0.93?1:0;return out?Math.max(0,lv-2):lv};   // si le doy a un lesionado, lo ve en ESPN: pesa mucho
const pAcc=(lv,fL)=>Math.min(0.9,[0.08,0.3,0.55,0.8][lv]+(fL>0?0.1:0));                                 // chance estimada de que acepte
const trOpp=fid=>{const H=trHor(),m=(S.op||{})[String(H.wkMu)];return m?m[String(S.me)]===fid:false};
const trCont=fid=>stN(fid)<=3;

/* evaluación exacta de un intercambio: tu roster y el suyo después del cambio (con quién suelta cada uno y a quién agregan) */
function trEval(fid,Gn,Qn){
  const C=trCache(),key=fid+'|'+[...Gn].sort().join(',')+'>'+[...Qn].sort().join(',');
  if(C.ex.has(key))return C.ex.get(key);
  const A=trTeam(S.me),B=trTeam(fid),P=trPair(fid),lim=trLim(),H=trHor();
  const G=Gn.map(n=>A.by[n]),Q=Qn.map(n=>B.by[n]);
  const Ea=A.E.filter(e=>!Gn.includes(e.n)).concat(Q.map(trIn)),exA={};Q.forEach(q=>exA[q.n]=P.qa[q.n].l);
  const sa=trSettle(A,Ea,lim,st.prot,exA);
  const Eb=B.E.filter(e=>!Qn.includes(e.n)).concat(G.map(trIn)),exB={};G.forEach(g=>exB[g.n]=P.ga[g.n].l);
  const sb=trSettle(B,Eb,lim,new Set(),exB);
  const r={key,fid,G:Gn,Q:Qn,gW:tvW(sa.E)-A.W,gL:tvL(sa.E)-A.L,fW:tvW(sb.E)-B.W,fL:tvL(sb.E)-B.L,
    aDrops:sa.drops.map(e=>e.n),aAdds:sa.adds.map(e=>e.n),aIR:sa.toIR,bDrops:sb.drops.map(e=>e.n),bAdds:sb.adds.map(e=>e.n),bIR:sb.toIR,Ea:sa.E,Eb:sb.E,
    bad:sa.bad||sb.bad,rho:trRho(G,Q),opp:trOpp(fid),cont:trCont(fid)};
  r.gWn=r.gW*H.wkK;r.fWn=r.fW*H.wkK;r.comb=(r.gWn+r.gL)/2;
  const fl=[];
  for(const g of G)if(isOut(g.p))fl.push({k:'inj',n:g.n,t:g.n+' está fuera por lesión: tu amigo lo puede notar.'});
  for(const g of G)if(g.p.inj==='DTD')fl.push({k:'dtd',n:g.n,t:g.n+' está día a día.'});
  for(const g of G)if((g.p.gp||0)<8&&!isOut(g.p))fl.push({k:'gp',n:g.n,t:g.n+' lleva pocos partidos ('+(g.p.gp||0)+'): su promedio es poco confiable.'});
  r.flags=fl;
  r.acc=accLv(r.rho.min,G.some(g=>g.out));

}
/* ¿pasa los filtros de cada modo? y con qué puntaje se ordena (null = no pasa) */
function trPass(r,mode,strict){
  if(r.bad)return null;
  const tol=TR_TOL[st.trd||'m'],E=TR_EPS;
  if(mode==='w')return r.rho.min>=0.93&&r.gW>=E&&r.gL>=-2*E?(r.gW-(r.opp?r.fW:0))*r.pAcc:null;
  if(mode==='l')return r.rho.min>=0.93&&r.gL>=E&&r.gWn>=-3*E?(r.gL-(r.cont?0.1*Math.max(0,r.fL):0))*r.pAcc:null;
  if(mode==='d')return r.rho.min>=tol&&r.comb>=0.75*E&&r.gWn>=-E&&r.gL>=-E&&!r.flags.some(f=>f.k==='inj')?r.comb*r.pAcc*(r.flags.some(f=>f.k==='gp')?0.85:1):null;
  if(mode==='p'){
    const lo=strict?0.4*E:-0.2*E,wl=strict?-E:-2*E;
    return r.rho.min>=0.93&&r.rho.m>=0.95&&r.rho.m<=1.08&&r.gL>=lo&&r.fL>=lo&&r.gWn>=wl&&r.fWn>=wl?Math.min(r.gL,r.fL)-0.5*Math.abs(r.gL-r.fL):null;
  }
  return null;
}
function trProxScore(H,mode,p,rho,opp,cont,out){
  const wn=p.myW*H.wkK,tol=TR_TOL[st.trd||'m'],E=TR_EPS,pa=pAcc(accLv(rho.min,out),p.frL);
  if(mode==='w')return rho.min<0.90||p.myL<-3*E?null:(p.myW-(opp?p.frW:0))*pa;
  if(mode==='l')return rho.min<0.90||wn<-4*E?null:(p.myL-(cont?0.1*Math.max(0,p.frL):0))*pa;
  if(mode==='d')return out||rho.min<tol-0.02||wn<-1.5*E||p.myL<-1.5*E?null:(wn+p.myL)/2*pa;
  if(mode==='p')return rho.min<0.9||rho.m<0.93||rho.m>1.10||Math.min(p.myL,p.frL)<-0.5*E||Math.min(p.myW,p.frW)*H.wkK<-1.5*E?null:Math.min(p.myL,p.frL)-0.5*Math.abs(p.myL-p.frL);
  return null;
}
/* candidatos baratos (sin armar alineaciones nuevas): los mejores por modo y compañero */
function trCands(mode){
  const C=trCache(),A=trTeam(S.me),out=[],fmt=st.trs||'';
  if(!C.sub.give)C.sub.give=trSubsets(A.E.filter(e=>!st.prot.has(e.n)));
  for(const t of S.teams){
    if(t.id===S.me)continue;
    const B=trTeam(t.id),P=trPair(t.id),opp=trOpp(t.id),cont=trCont(t.id),list=[],H=trHor();
    if(!C.sub[t.id])C.sub[t.id]=trSubsets(B.E);
    for(const G of C.sub.give)for(const Q of C.sub[t.id]){
      if(fmt&&(G.length!==+fmt[0]||Q.length!==+fmt[1]))continue;
      const rho=trRho(G,Q);
      if(rho.min<0.88)continue;
      const sc0=trProxScore(H,mode,trProx(A,B,P,G,Q),rho,opp,cont,G[0].out||(G.length>1&&G[1].out));
      if(sc0==null)continue;
      list.push({fid:t.id,G,Q,sc:sc0});
    }
    list.sort((a,b)=>b.sc-a.sc);
    out.push(...diversify(list,TR_PER,x=>x.G.map(e=>e.n),x=>x.Q.map(e=>e.n),3).map(x=>({fid:x.fid,G:x.G.map(e=>e.n),Q:x.Q.map(e=>e.n),sc:x.sc})));
  }
  return out;
}
function diversify(list,max,fg,fq,cap){
  const cg={},cq={},res=[];
  for(const x of list){
    if(res.length>=max)break;
    const g=fg(x),q=fq(x);
    if(g.some(n=>(cg[n]||0)>=cap)||q.some(n=>(cq[n]||0)>=cap))continue;
    g.forEach(n=>cg[n]=(cg[n]||0)+1);q.forEach(n=>cq[n]=(cq[n]||0)+1);res.push(x);
  }
  return res;
}
function trFinish(mode,cands){
  const ev=cands.map(c=>trEval(c.fid,c.G,c.Q)),L=[];
  for(const r of ev){const s=trPass(r,mode,true);if(s!=null)L.push({r,s})}
  if(mode==='p'&&L.length<3){for(const r of ev){if(L.some(x=>x.r===r))continue;const s=trPass(r,mode,false);if(s!=null)L.push({r,s,loose:true})}}
  L.sort((a,b)=>(!!a.loose-!!b.loose)||b.s-a.s);
  const byF={},out=[];                              // variedad dentro de cada compañero: no repetir el mismo jugador más de 2 veces
  for(const x of L)(byF[x.r.fid]=byF[x.r.fid]||[]).push(x);
  for(const f in byF)out.push(...diversify(byF[f],6,x=>x.r.G,x=>x.r.Q,2));
  out.sort((a,b)=>(!!a.loose-!!b.loose)||b.s-a.s);
  return {list:out.slice(0,TR_KEEP).map(x=>({...x.r,score:x.s,loose:!!x.loose})),n:cands.length};
}
const trResKey=mode=>mode+'|'+(mode==='d'?(st.trd||'m'):'')+'|'+(st.trs||'');
function trRankSync(mode){
  const C=trCache(),k=trResKey(mode);if(C.res[k])return C.res[k];
  return C.res[k]=trFinish(mode,trCands(mode));
}
/* versión por pedazos para no congelar el celular */
function trRankAsync(mode,cb){
  const C=trCache(),k=trResKey(mode);if(C.res[k]){cb();return}
  const j=C.job[k];if(j&&!j.done)return;
  const job=C.job[k]={i:0,n:0,done:false,pct:0,cands:null};
  const now=()=>typeof performance!=='undefined'?performance.now():Date.now();
  const step=()=>{
    if(_tc!==C)return;                               // los datos cambiaron: este cálculo ya no sirve
    try{
      if(!job.cands){job.cands=trCands(mode);job.n=job.cands.length;setTimeout(step,0);return}
      const t0=now();
      while(job.i<job.n&&now()-t0<35){const c=job.cands[job.i++];trEval(c.fid,c.G,c.Q)}
      job.pct=job.n?job.i/job.n:1;
      if(job.i<job.n){const e=document.getElementById('trpct');if(e)e.textContent=Math.round(job.pct*100)+'%';setTimeout(step,0);return}
      C.res[k]=trFinish(mode,job.cands);job.done=true;cb();
    }catch(err){job.done=true;job.err=String(err&&err.message||err);cb()}
  };
  setTimeout(step,30);
}
/* contraofertas: variantes de una oferta que a ti te dejan mejor y que a él le siguen pareciendo razonables */
function trVariants(fid,G,Q){
  const A=trTeam(S.me),B=trTeam(fid),give=A.E.map(e=>e.n).filter(n=>!st.prot.has(n)||G.includes(n)),get=B.E.map(e=>e.n),out=[];
  const add=(g,q,txt)=>{if(!g.length||!q.length||g.length>2||q.length>2)return;out.push({G:g,Q:q,txt})};
  if(Q.length<2)for(const n of get)if(!Q.includes(n))add(G,[...Q,n],{k:'addq',n});
  for(const q of Q)for(const n of get)if(!Q.includes(n))add(G,Q.map(x=>x===q?n:x),{k:'swq',n,o:q});
  for(const g of G)for(const n of give)if(!G.includes(n))add(G.map(x=>x===g?n:x),Q,{k:'swg',n,o:g});
  if(G.length===2)for(const g of G)add(G.filter(x=>x!==g),Q,{k:'rmg',n:g});
  if(Q.length===2)for(const q of Q)add(G,Q.filter(x=>x!==q),{k:'rmq',n:q});
  return out;
}
function trCounters(fid,G,Q){                   // se prefiltra con la estimación barata y solo los mejores pasan al cálculo exacto
  const A=trTeam(S.me),P=trPair(fid),B=trTeam(fid),H=trHor();
  return trVariants(fid,G,Q).map(v=>{const g=v.G.map(n=>A.by[n]),q=v.Q.map(n=>B.by[n]),rho=trRho(g,q),p=trProx(A,B,P,g,q);return {v,rho,s:(p.myW*H.wkK+p.myL)/2}})
    .filter(x=>x.rho.min>=0.93).sort((a,b)=>b.s-a.s).slice(0,18).map(x=>x.v);
}
function trCounterRes(fid,base,variants){
  const rs=variants.map(v=>({v,r:trEval(fid,v.G,v.Q)})).filter(x=>!x.r.bad&&x.r.rho.min>=0.93&&x.r.comb>base.comb+0.5*TR_EPS&&x.r.gL>=base.gL-0.25*TR_EPS);
  rs.sort((a,b)=>b.r.comb-a.r.comb);
  return diversify(rs.map(x=>({...x,G:x.r.G,Q:x.r.Q})),3,x=>x.G,x=>x.Q,2);
}

/* búsqueda por jugador: dir 'q' = me ofrecen a ... (fixed = jugadores del amigo fid) y busco qué darle de mi roster;
   dir 'g' = yo doy a ... (fixed = mis jugadores) y busco qué me pueden ofrecer (de fid, o de cualquiera si fid=0) */
function trFind(dir,fid,fixed,mode){
  const C=trCache(),k=dir+'|'+fid+'|'+fixed.join(',')+'|'+mode+'|'+(mode==='d'?(st.trd||'m'):'');
  C.fnd=C.fnd||{};if(C.fnd[k])return C.fnd[k];
  const A=trTeam(S.me),H=trHor(),tol=mode==='d'?TR_TOL[st.trd||'m']:0.93,pre=[];let best=0;
  const fids=dir==='q'?[fid]:(fid?[fid]:S.teams.filter(t=>t.id!==S.me).map(t=>t.id));
  for(const f of fids){
    const B=trTeam(f),P=trPair(f),opp=trOpp(f),fx=fixed.map(n=>(dir==='q'?B:A).by[n]);
    if(!fx.length||fx.some(x=>!x))continue;
    const subs=dir==='q'?trSubsets(A.E.filter(e=>!st.prot.has(e.n))):trSubsets(B.E),cand=[];
    for(const s of subs){
      const G=dir==='q'?s:fx,Q=dir==='q'?fx:s,rho=trRho(G,Q);
      if(rho.min>best)best=rho.min;
      if(rho.min<0.88)continue;
      const p=trProx(A,B,P,G,Q),pa=pAcc(accLv(rho.min,G.some(g=>g.out)),p.frL);
      const g=mode==='w'?p.myW-(opp?p.frW:0):mode==='l'?p.myL:(p.myW*H.wkK+p.myL)/2;
      cand.push({G:G.map(e=>e.n),Q:Q.map(e=>e.n),s:g>=0?g*pa:g});
    }
    cand.sort((a,b)=>b.s-a.s);
    for(const c of cand.slice(0,16))pre.push({f,G:c.G,Q:c.Q});
  }
  const L=[];
  for(const c of pre){
    const r=trEval(c.f,c.G,c.Q);
    if(r.bad||r.rho.min<tol)continue;
    if(mode==='d'&&r.flags.some(x=>x.k==='inj'))continue;
    const g=mode==='w'?r.gW-(r.opp?r.fW:0):mode==='l'?r.gL:r.comb;
    L.push({r,g,s:g>=0?g*r.pAcc:g});
  }
  L.sort((a,b)=>b.s-a.s);
  const out=diversify(L,8,x=>dir==='q'?x.r.G:[],x=>dir==='g'?x.r.Q:[],2);
  return C.fnd[k]={list:out.map(x=>({...x.r,score:x.s,gain:x.g})),n:pre.length,best};
}

/* una frase con la razón principal de un intercambio */

function trRow(r,mode){

  if(d.tload){const key=d.tload,i=key.indexOf('|'),j=key.indexOf('>');st.tro={f:Number(key.slice(0,i)),g:key.slice(i+1,j).split(',').filter(Boolean),q:key.slice(j+1).split(',').filter(Boolean)};st.tab='trade';st.trm='o';st.tos='o';
    if(st.sheet){st.sheetStack=[];st.sheet=null;renderSheet();try{if(history.state&&history.state.sheet)history.back()}catch(_){}}render();window.scrollTo(0,0);return true}
  if(d.tgo){const e=document.getElementById('trres');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});return true}

  bul.push('Gasta 1 de tus movimientos de la semana. Si sueltas a '+esc(p.n)+', un compañero de la liga lo puede recoger.');
  const rows=ev.rows.filter(r=>Math.abs(r.diff)>0.05||game(f.t,r.day)||game(p.t,r.day)).map(r=>`<tr><td style="text-align:left">${dl(r.day)}</td><td>≈${f0(r.a)}</td><td>≈${f0(r.b)}</td><td class="y">${r.diff>=0?'+':''}${f0(r.diff)}</td></tr>`).join('');
  return `<div class="glass card"><h3>Cambio</h3><div class="row" style="gap:10px;margin-top:10px">${av(f)}<div class="grow"><div class="note">Agregar</div><div class="nm" style="font-size:17px">${esc(f.n)}</div><div class="meta">${f.t} · ${esc(f.pos)} ${badge(f.inj)}</div></div></div>
    <div class="row" style="gap:10px;margin-top:12px">${av(p)}<div class="grow"><div class="note">Soltar</div><div class="nm" style="font-size:17px">${esc(p.n)}</div><div class="meta">${p.t} · ${esc(p.pos)} ${badge(p.inj)}</div></div></div>
    <div class="hero" style="margin-top:14px"><div class="stat"><div class="lab">Suma</div><div class="big">+${f0(ev.gain)}</div><div class="note">pts en ${k==='b'?'2 semanas':k==='rd'?'ese día':k==='rc'?'lo que resta de la semana':'el periodo'}</div></div><div class="stat"><div class="lab">Para</div><div class="big" style="font-size:26px;line-height:1.1">${lab}</div></div></div>
    <div class="note" style="margin-top:8px">Esta semana ${gWk>=0?'+':''}${f0(gWk)} · siguiente ${gNx>=0?'+':''}${f0(gNx)}</div></div>
    <div class="glass card"><h3>Por qué</h3><ul class="why">${bul.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="glass card"><h3>Día por día</h3><div class="note" style="margin:6px 0 8px">Puntos esperados de tu mejor alineación, sin el cambio y con el cambio.</div><div class="scroll"><table class="wk"><tr><th style="text-align:left">Día</th><th>Sin</th><th>Con</th><th>Dif.</th></tr>${rows}</table></div></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="chip" data-pl="${esc(f.n)}">Ver a ${esc(f.n)}</button><button class="chip" data-pl="${esc(p.n)}">Ver a ${esc(p.n)}</button></div>`;
}
function renderSheet(){
  const el=document.getElementById('sheet'); if(!el)return;
  const s=st.sheet;
  if(!s){el.innerHTML='';el.className='';document.body.style.overflow='';return}
  const body=s.t==='tr'?tradeSheet(s.k):s.t==='sw'?swapSheet(s.a,s.d,s.k):s.t==='rd'?radarSheet(s.n):s.t==='ds'?daySheet(s.a,s.d,s.day):playerSheet(s.n);
  const keep=el.firstElementChild?el.scrollTop:0;
  el.className='open';
  el.innerHTML=`<div class="wrap"><div class="shbar"><button class="arrow" id="back" aria-label="Atrás">‹</button><div class="note">Desliza hacia la derecha para volver</div></div>${body}</div>`;
  document.body.style.overflow='hidden';
}
function openSheet(s){st.sheetStack=(st.sheetStack||[]);if(st.sheet)st.sheetStack.push(st.sheet);else{try{history.pushState({sheet:1},'')}catch(_){}}st.sheet=s;renderSheet();const el=document.getElementById('sheet');if(el)el.scrollTop=0}
function closeSheet(fromPop){
  if(st.sheetStack&&st.sheetStack.length){st.sheet=st.sheetStack.pop();renderSheet();return}
  st.sheet=null;renderSheet();
  if(!fromPop){try{if(history.state&&history.state.sheet)history.back()}catch(_){}}
}

function render(){
  const body=st.tab==='roster'?rosterView():st.tab==='liga'?ligaView():st.tab==='agents'?agentsView():st.tab==='plan'?planView():st.tab==='trade'?tradesView():minasView();
  const ae=document.activeElement, keepF=ae&&ae.id==='rq', cp=keepF?ae.selectionStart:0;
  $('#app').innerHTML=header()+body;
  if(keepF){const n=$('#rq');if(n){n.focus();try{n.setSelectionRange(cp,cp)}catch(_){}}}
  renderSheet();
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${st.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
}

let busy=false;
const REPO='leonardo0mariscal-glitch/fantasy';
const API_URL='https://api.github.com/repos/'+REPO+'/contents/data.json?ref=data';
const DATA_URL='https://raw.githubusercontent.com/'+REPO+'/data/data.json';
let lastLoad=0;
async function getData(){
  // 1) API de GitHub (sin la caché de 5 min de raw); 2) raw; 3) copia local
  const tries=[
    [API_URL+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}}],
    [DATA_URL+'?t='+Date.now(),{cache:'no-store'}],
    ['data.json?t='+Date.now(),{cache:'no-store'}]
  ];
  for(const [u,o] of tries){
    try{const r=await fetch(u,o);if(r.ok){const j=await r.json();if(j&&j.teams)return j}}catch(_){}
  }
  return null;
}
async function load(manual){
  if(busy)return; busy=true; st.refBusy=true; if(manual){st.refMsg='';} render();
  let msg='';
  const j=await getData(); lastLoad=Date.now();
  if(j){const nuevo=Date.parse(j.u)>Date.parse(S.u); const cambio=JSON.stringify(j.teams.map(t=>t.pts))!==JSON.stringify(S.teams.map(t=>t.pts)); S=j;
    msg=nuevo?(cambio?'Datos nuevos de ESPN.':'Revisado: ESPN no tiene cambios nuevos.'):'Aún no hay lectura nueva del robot (el robot lee ESPN cada ~2 min).';}
  else msg='No pude leer los datos; se muestran los últimos que tenía.';
  busy=false; st.refBusy=false; st.refMsg=manual?msg:''; render();
}
if(typeof document!=='undefined'){
  document.addEventListener('click',e=>{
    const tp=e.target.closest('[data-pl],[data-sw],[data-rd],[data-ds],[data-goad],[data-tr]');
    if(tp&&!e.target.closest('[data-prot]')){
      if(tp.dataset.goad){st.tab='agents';st.ad=tp.dataset.goad;if(st.sheet){st.sheetStack=[];st.sheet=null;renderSheet()}render();window.scrollTo(0,0);}
      else if(tp.dataset.ds){const [a,d,day]=tp.dataset.ds.split('|');openSheet({t:'ds',a,d,day});}
      else if(tp.dataset.sw){const [a,d,k]=tp.dataset.sw.split('|');openSheet({t:'sw',a,d,k});}
      else if(tp.dataset.rd){openSheet({t:'rd',n:tp.dataset.rd});}
      else if(tp.dataset.tr){openSheet({t:'tr',k:tp.dataset.tr});}
      else openSheet({t:'pl',n:tp.dataset.pl});
      return;
    }
    const t=e.target.closest('button'); if(!t)return;
    if(t.id==='back'){closeSheet();return}
    if(trTap(t.dataset))return;
    if(t.dataset.tab){st.tab=t.dataset.tab;render();window.scrollTo(0,0);}
    else if(t.id==='refresh')load(true);
    else if(t.id==='prev'&&st.di>0){st.di--;render();}
    else if(t.id==='next'&&st.di<days().length-1){st.di++;render();}
    else if(t.dataset.rm){st.rmode=t.dataset.rm;render();}
    else if(t.dataset.mt){st.mt=t.dataset.mt;render();}
    else if(t.dataset.rh){st.rh=t.dataset.rh;renderSheet();}
    else if(t.dataset.view){st.view=t.dataset.view;render();}
    else if(t.dataset.wk){st.wk=t.dataset.wk;render();}
    else if(t.dataset.ad!==undefined){st.ad=t.dataset.ad||null;render();}
    else if(t.dataset.pos){st.pos=t.dataset.pos;render();}
    else if(t.id==='hide'){st.hide=!st.hide;render();}
    else if(t.dataset.h){st.h=t.dataset.h;render();}
    else if(t.dataset.prot){const n=t.dataset.prot;st.prot.has(n)?st.prot.delete(n):st.prot.add(n);try{localStorage.setItem('leo_prot',JSON.stringify([...st.prot]))}catch(_){}render();}
  });
  document.addEventListener('input',e=>{ if(e.target.id==='rq'){st.q=e.target.value;const r=$('#rres');if(r)r.innerHTML=radarResults();return} if(e.target.id==='dtd'){st.dtd=Number(e.target.value)/100;const v=$('#dtdv');if(v)v.textContent=e.target.value+'%';clearTimeout(window.__dt);window.__dt=setTimeout(render,250);} });
  window.addEventListener('popstate',()=>{if(st.sheet){st.sheetStack=[];st.sheet=null;renderSheet()}});
  let tx=0,ty=0;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(!st.sheet)return;const t=e.changedTouches[0];const dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);if(dx>80&&dy<70&&!e.target.closest('.scroll'))closeSheet()},{passive:true});
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-lastLoad>60000)load(false); });
  setInterval(()=>load(false),3*60*1000);
  const t0=days().indexOf(todayKey()); st.di=Math.max(0,t0);
  render(); load(false).then(()=>{const i=days().indexOf(todayKey());if(i>=0){st.di=i;render();}});
}
</script>

/* Layout idea: one phone column on a light-gray field; frosted white glass cards; black buttons and accents. */
:root{
  --ink:#0c0c0e; --bg:#e3e4e7; --text:#101012; --mut:#6a6d75;
  --line:rgba(0,0,0,.09);
  --amber:#101012; --good:#101012; --warn:#4a4c52; --bad:#101012;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;
  background-image:linear-gradient(115deg,#f4f5f7 0%,#d2d4d9 22%,#f1f2f4 38%,#aeb1b8 58%,#eceef0 74%,#c3c5cb 100%);
  background-attachment:fixed;position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:14px}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.08) 50%,rgba(255,255,255,.26));border:1px solid rgba(255,255,255,.55);border-radius:26px;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.4),inset 1.5px 0 1px rgba(255,255,255,.5),inset -1.5px 0 1px rgba(255,255,255,.3),0 10px 32px rgba(30,32,40,.14);-webkit-backdrop-filter:blur(14px) saturate(190%) brightness(1.06);backdrop-filter:blur(14px) saturate(190%) brightness(1.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(255,255,255,.35) 100%);opacity:.7}
.av{position:relative;width:44px;height:44px;flex:none;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(170,173,181,.8));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 1px #fff,0 3px 8px rgba(0,0,0,.15);display:grid;place-items:center;font:700 14px var(--display);color:#3a3b41;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:#d4d5da}
.av.sm{width:34px;height:34px;font-size:12px}
.slot{width:36px!important}
.card{padding:16px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:21px}
h3{font-size:16px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.btn{font:700 14px var(--body);color:#fff;background:linear-gradient(180deg,#3a3b41,#0c0c0e);border:0;border-radius:14px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);white-space:nowrap}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.arrow:focus-visible{outline:2px solid #0c0c0e;outline-offset:2px}
.btn.ghost{background:rgba(255,255,255,.7);color:#0c0c0e;border:1px solid rgba(0,0,0,.1);padding:10px 14px;font-size:16px;box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(0,0,0,.1)}
.btn[disabled]{opacity:.5;cursor:default}
.big{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .big{font-size:46px;line-height:1}
.stat .lab{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.gap{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.75);white-space:nowrap}
.pill.O{background:#0c0c0e;color:#fff;border-color:#0c0c0e}
.pill.DTD{background:transparent;border:1px dashed #4a4c52}
.pill.good{background:#d8d9dd}
.pill.amber{background:#c4c6cb}
.slot{width:42px;flex:none;text-align:center;font:700 13px var(--display);letter-spacing:.04em;padding:6px 0;border-radius:10px;background:#0c0c0e;color:#fff}
.slot.BE{background:rgba(0,0,0,.08);color:var(--mut)}
.slot.IR{background:transparent;border:1px dashed #8d9098;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:12px;color:var(--mut)}
.val{font:700 20px var(--display);text-align:right;min-width:46px;font-variant-numeric:tabular-nums}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.arrow{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--text);font-size:20px;cursor:pointer}
.arrow[disabled]{opacity:.35;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--text);cursor:pointer}
.chip.on{background:#0c0c0e;color:#fff;border-color:#0c0c0e}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#a3a5ac,#5a5c63);border-radius:99px}
.bar.me>i{background:linear-gradient(90deg,#2c2d32,#0c0c0e)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav .glass{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:26px;width:100%;max-width:560px}
.tab{flex:1;font:600 12px var(--body);padding:10px 2px;border-radius:20px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.tab.on{background:#0c0c0e;color:#fff}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.note{font-size:12px;color:var(--mut)}
.warnbox{border-left:3px solid #0c0c0e;padding:8px 12px;background:rgba(0,0,0,.05);border-radius:10px;font-size:13px}
.ai{white-space:normal;font-size:14.5px}
.ai p{margin:0 0 10px}.ai ul{margin:0 0 10px;padding-left:20px}.ai strong{color:var(--ink)}
.ai h4{font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin:14px 0 6px}
input[type=range]{width:100%;accent-color:#0c0c0e}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.wk{border-collapse:collapse;font-size:12px;width:100%;min-width:430px}
table.wk th,table.wk td{padding:7px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
table.wk th{font-weight:600;color:var(--mut);border-top:0;line-height:1.2}
table.wk td:first-child,table.wk th:first-child{text-align:left;position:sticky;left:0;background:#f1f1f3;z-index:1;max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.wk .y{font-weight:700}
table.wk .n{color:#b4b6bc}
table.wk .lk{text-decoration:line-through;color:var(--mut)}
.right{text-align:right}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:transform .12s}.btn:active,.chip:active{transform:scale(.97)}}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:rgba(0,0,0,.04)}
.chev{color:var(--mut);font-size:22px;padding-left:2px}
#sheet{position:fixed;inset:0;z-index:50;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch;background:linear-gradient(115deg,#f4f5f7 0%,#d2d4d9 22%,#f1f2f4 38%,#aeb1b8 58%,#eceef0 74%,#c3c5cb 100%)}
#sheet.open{display:block}
@media (prefers-reduced-motion:no-preference){#sheet.open .wrap{animation:shin .22s ease-out}@keyframes shin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}}
.shbar{display:flex;align-items:center;gap:12px}
ul.why{margin:8px 0 0;padding-left:18px;font-size:14px}ul.why li{margin:0 0 7px}
.chip.auto{border-style:dashed}
.chip.sm{font-size:12px;padding:5px 11px}
.sbox{width:100%;box-sizing:border-box;font:500 16px var(--body);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.sbox:focus{border-color:#0c0c0e;box-shadow:0 0 0 3px rgba(12,12,14,.1)}
.dim{opacity:.55}
.val .sub{font:600 11px var(--body);color:var(--mut);letter-spacing:0}
.hero.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero.three .stat .big{font-size:clamp(28px,9.2vw,42px)}
.hero.three .stat .lab{font-size:10.5px;letter-spacing:.03em}
.hero.three .stat .note{font-size:11px}
</style>

  if(c.includes(':')){const [m,s2]=c.split(':');mins=(+m||0)+(+s2||0)/60}else mins=(parseFloat(c)||0)/60;

  const [h,m]=gm.time.split(':').map(Number),n=etNow(); const el=(+n.hour*60+ +n.minute)-(h*60+m);

/* mejor alineación de un día: asigna jugadores a los 10 espacios maximizando puntos esperados */
function bestDay(R,day,skipStarted){
  const c=[];

    if(p.slot==='IR')continue;
    const g=game(p.t,day); if(!g)continue;
    if(skipStarted&&started(day,g.time))continue;

  const M=1<<SLOTS.length; let dp=new Float64Array(M).fill(-1); dp[0]=0; const ch=[];
  for(const x of c){

  const assign=[]; let m=bm;
  for(let i=c.length-1;i>=0;i--){ const s=ch[i][m]; if(s>=0){assign.push({p:c[i].p,slot:SLOTS[s][0],v:c[i].v}); m^=1<<s;} }

function swapList(hd,lim){
  const R0=roster(team(S.me)), AP=autoProt(R0);
  const drops=R0.filter(p=>p.slot!=='IR'&&!st.prot.has(p.n)&&!AP.has(p.n)).sort((a,b)=>a.e*avail(a)-b.e*avail(b)).slice(0,6);
  const base=hd.map(d=>bestDay(R0,d,d===todayKey()).tot);
  const fas=S.fa.map(mkF).filter(f=>f.inj!=='O'&&avail(f)>0).map(f=>({f,v:f.e*avail(f)*gamesIn(f.t,hd)})).sort((a,b)=>b.v-a.v).slice(0,12);
  const out=[];
  for(const {f} of fas){
    let best=null;
    for(const d of drops){
      if(f.e*avail(f)<d.e*avail(d)+2)continue;
      const ev=evalSwap(R0,f,d,hd,base);
      if(!best||ev.gain>best.ev.gain)best={d,ev};
    }
    if(best&&best.ev.gain>0.5)out.push({add:f,drop:best.d,ev:best.ev,gain:best.ev.gain,label:labelOf(f,best.d)});
  }
  out.sort((a,b)=>b.gain-a.gain);
  return out.slice(0,lim);
}
function planMoves(h){
  const hd=horizon(h), base=roster(team(S.me)).map(p=>({...p}));
  return {b0:weekTotal(base,hd),res:swapList(hd,6),hd};
}
function goldList(){
  const soon=days().slice(0,2);
  return swapList(hdOf('b'),12).filter(o=>o.gain>=12&&o.add.ws!=='W'&&soon.some(d=>game(o.add.t,d)));
}
function findAny(name){
  for(const t of S.teams){for(const a of t.r){if(a[0]===name){const p=mkP(a);p.owner=t.id;return p}}}
  for(const a of S.fa){if(a[0]===name){const p=mkF(a);p.owner=0;return p}}
  for(const a of (S.fs||[])){if(a[0]===name){const p=mkF(a);p.owner=0;return p}}
  return null;
}
function rankIn(R,p){return R.filter(x=>x.slot!=='IR').sort((a,b)=>b.e-a.e).findIndex(x=>x.n===p.n)+1}

function dayView(){
  const D=days(), day=D[st.di], me=team(S.me), R=roster(me);
  const opt=bestDay(R,day,false), optSet=new Map(opt.assign.map(a=>[a.p.n,a.slot]));
  const cur=R.filter(p=>p.slot!=='BE'&&p.slot!=='IR');
  let curTot=0,curN=0; for(const p of cur){ if(game(p.t,day)){curTot+=p.e*avail(p);curN++;} }
  const ups=R.filter(p=>(p.slot==='BE'||p.slot==='IR')&&optSet.has(p.n)).map(p=>p.n);
  const downs=cur.filter(p=>!optSet.has(p.n)&&ups.length).map(p=>p.n).slice(0,ups.length+1);
  const rows=[...R].sort((a,b)=>ORDER.indexOf(a.slot)-ORDER.indexOf(b.slot)).map(p=>{
    const g=game(p.t,day), isStart=p.slot!=='BE'&&p.slot!=='IR', lock=g&&started(day,g.time);
    let tag='';
    if(g&&!lock&&isStart&&!optSet.has(p.n)&&ups.length) tag='<span class="pill amber">Mejor en banca</span>';
    if(g&&!lock&&!isStart&&optSet.has(p.n)) tag='<span class="pill good">Mejor titular</span>';
    const q=gameState(p,day,g), act=dayPts(me,day,p.id), none='<span class="mut">–</span>';
    let vh;
    if(q.s==='none') vh=none;
    else if(st.rmode==='live') vh=(act!=null&&(q.s==='in'||q.s==='post'))?fp(act):none;
    else if(q.s==='post') vh=act!=null?fp(act):none;
    else if(q.s==='in'&&act!=null) vh='≈'+f0(liveProj(p,act,q.f))+`<div class="sub">lleva ${fp(act)}</div>`;
    else vh='≈'+f0(p.e*avail(p));
    let est=lock?' · ya empezó':'';
    if(q.gs&&q.s==='in') est=' · '+(q.gs.p>4?'OT':'Q'+q.gs.p)+' '+esc(q.gs.c);
    else if(q.gs&&q.s==='post') est=' · final';
    else if(q.gs&&q.s==='pre') est='';
    return `<div class="item tap" data-pl="${esc(p.n)}"><div class="slot ${p.slot}">${p.slot}</div>${av(p)}<div class="grow"><div class="nm">${esc(p.n)} ${badge(p.inj)}</div>
      <div class="meta">${p.t} · ${p.pos} · ${g?esc(g.opp)+' '+tm12(g.time)+est:'sin partido'} ${tag}</div></div>
      <div class="val">${vh}</div></div>`}).join('');
  const sw=ups.length?`<div class="note" style="margin-top:8px"><b>Sube:</b> ${ups.map(esc).join(', ')} · <b>baja:</b> ${downs.map(esc).join(', ')||'–'}. Esperado ${f0(opt.tot)} vs ${f0(curTot)} con tu alineación actual.</div>`:`<div class="note" style="margin-top:8px">Tu alineación actual ya es la mejor que veo para este día: esperado ${f0(curTot)} pts con ${curN} titulares jugando.</div>`;
  return `<div class="glass card"><div class="dayhead"><button class="arrow" id="prev" aria-label="Día anterior" ${st.di===0?'disabled':''}>‹</button>
    <div style="text-align:center"><h2>${dl(day)}</h2><div class="note">${(S.sched[day]||[]).length} partidos NBA${day===todayKey()?' · hoy':''}</div></div>
    <button class="arrow" id="next" aria-label="Día siguiente" ${st.di===D.length-1?'disabled':''}>›</button></div>${sw}</div>
    <div class="glass card"><h3>Roster</h3>
    <div class="chips" style="margin-top:8px"><button class="chip sm ${st.rmode==='live'?'on':''}" data-rm="live">Live</button><button class="chip sm ${st.rmode==='exp'?'on':''}" data-rm="exp">Puntos esperados</button></div>
    <div class="note" style="margin-top:6px">${st.rmode==='live'?(team(S.me).pd?'Puntos reales de ESPN de este día. Un guión es que aún no juega (o no tiene partido).':'Aún no llegan los puntos en vivo: el robot los empieza a leer en su próxima vuelta.'):'Lo que se espera que termine cada uno. En partidos en curso se corrige con lo que ya lleva.'}</div>
    <div style="margin-top:6px">${rows}</div>
</div>`;
}

  const used=st.h==='n'?0:me.acq, left=7-used;
  const dayRows=P.hd.map(d=>{const o=bestDay(R,d,false);const pct=o.cnt/10*100;const g=(S.sched[d]||[]).length;
    return `<div class="row" style="padding:5px 0"><div style="width:76px" class="note">${dl(d)}</div><div class="grow"><div class="bar ${o.cnt<10?'':'me'}"><i style="width:${Math.max(3,pct)}%"></i></div></div><div class="num" style="width:62px;text-align:right"><b>${o.cnt}</b>/10</div><div class="num mut" style="width:48px;text-align:right">≈${f0(o.tot)}</div></div>`}).join('');

  bul.push(lab==='Para mucho tiempo'?`Es para mucho tiempo: rinde claramente más por partido y no solo por tener más juegos.`:`Es solo para esta semana: la ganancia viene sobre todo de que juega más partidos o de una racha, no de ser claramente mejor que ${esc(p.n)}.`);
  bul.push(`${esc(p.n)} es el #${rk} de tu roster por rendimiento esperado${AP.has(p.n)?' (ojo: está entre tus mejores)':' y no está entre los 7 que la app protege'}.`);
  if(f.inj==='DTD')bul.push(`${esc(f.n)} está en día a día: ya descuento ${Math.round((1-st.dtd)*100)}% por riesgo de que no juegue.`);
  if(f.ws==='W')bul.push(`Está en waivers: solo cuenta desde la próxima semana.`);
  if(gWk<-2)bul.push(`Ojo: te cuesta ${f0(-gWk)} pts esta semana. Si lo haces después del último partido de la semana (domingo), conservas a ${esc(p.n)} para sus partidos de ahora y no pierdes esos puntos.`);
  bul.push('Gasta 1 de tus movimientos de la semana. Si sueltas a '+esc(p.n)+', un compañero de la liga lo puede recoger.');
  const rows=ev.rows.filter(r=>Math.abs(r.diff)>0.05||game(f.t,r.day)||game(p.t,r.day)).map(r=>`<tr><td style="text-align:left">${dl(r.day)}</td><td>≈${f0(r.a)}</td><td>≈${f0(r.b)}</td><td class="y">${r.diff>=0?'+':''}${f0(r.diff)}</td></tr>`).join('');
  return `<div class="glass card"><h3>Cambio</h3><div class="row" style="gap:10px;margin-top:10px">${av(f)}<div class="grow"><div class="note">Agregar</div><div class="nm" style="font-size:17px">${esc(f.n)}</div><div class="meta">${f.t} · ${esc(f.pos)} ${badge(f.inj)}</div></div></div>
    <div class="row" style="gap:10px;margin-top:12px">${av(p)}<div class="grow"><div class="note">Soltar</div><div class="nm" style="font-size:17px">${esc(p.n)}</div><div class="meta">${p.t} · ${esc(p.pos)} ${badge(p.inj)}</div></div></div>
    <div class="hero" style="margin-top:14px"><div class="stat"><div class="lab">Suma</div><div class="big">+${f0(ev.gain)}</div><div class="note">pts en ${k==='b'?'2 semanas':'el periodo'}</div></div><div class="stat"><div class="lab">Para</div><div class="big" style="font-size:26px;line-height:1.1">${lab}</div></div></div>
    <div class="note" style="margin-top:8px">Esta semana ${gWk>=0?'+':''}${f0(gWk)} · siguiente ${gNx>=0?'+':''}${f0(gNx)}</div></div>
    <div class="glass card"><h3>Por qué</h3><ul class="why">${bul.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="glass card"><h3>Día por día</h3><div class="note" style="margin:6px 0 8px">Puntos esperados de tu mejor alineación, sin el cambio y con el cambio.</div><div class="scroll"><table class="wk"><tr><th style="text-align:left">Día</th><th>Sin</th><th>Con</th><th>Dif.</th></tr>${rows}</table></div></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="chip" data-pl="${esc(f.n)}">Ver a ${esc(f.n)}</button><button class="chip" data-pl="${esc(p.n)}">Ver a ${esc(p.n)}</button></div>`;
}
function renderSheet(){
  const el=document.getElementById('sheet'); if(!el)return;
  const s=st.sheet;
  if(!s){el.innerHTML='';el.className='';document.body.style.overflow='';return}
  const body=s.t==='sw'?swapSheet(s.a,s.d,s.k):s.t==='rd'?radarSheet(s.n):playerSheet(s.n);
  const keep=el.firstElementChild?el.scrollTop:0;
  el.className='open';
  el.innerHTML=`<div class="wrap"><div class="shbar"><button class="arrow" id="back" aria-label="Atrás">‹</button><div class="note">Desliza hacia la derecha para volver</div></div>${body}</div>`;
  document.body.style.overflow='hidden';
}
function openSheet(s){st.sheetStack=(st.sheetStack||[]);if(st.sheet)st.sheetStack.push(st.sheet);else{try{history.pushState({sheet:1},'')}catch(_){}}st.sheet=s;renderSheet();const el=document.getElementById('sheet');if(el)el.scrollTop=0}
function closeSheet(fromPop){
  if(st.sheetStack&&st.sheetStack.length){st.sheet=st.sheetStack.pop();renderSheet();return}
  st.sheet=null;renderSheet();
  if(!fromPop){try{if(history.state&&history.state.sheet)history.back()}catch(_){}}
}

function render(){
  const body=st.tab==='roster'?rosterView():st.tab==='liga'?ligaView():st.tab==='agents'?agentsView():st.tab==='plan'?planView():minasView();
  const ae=document.activeElement, keepF=ae&&ae.id==='rq', cp=keepF?ae.selectionStart:0;
  $('#app').innerHTML=header()+body;
  if(keepF){const n=$('#rq');if(n){n.focus();try{n.setSelectionRange(cp,cp)}catch(_){}}}
  renderSheet();
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${st.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
}

let busy=false;
const REPO='leonardo0mariscal-glitch/fantasy';
const API_URL='https://api.github.com/repos/'+REPO+'/contents/data.json?ref=data';
const DATA_URL='https://raw.githubusercontent.com/'+REPO+'/data/data.json';
let lastLoad=0;
async function getData(){
  // 1) API de GitHub (sin la caché de 5 min de raw); 2) raw; 3) copia local
  const tries=[
    [API_URL+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}}],
    [DATA_URL+'?t='+Date.now(),{cache:'no-store'}],
    ['data.json?t='+Date.now(),{cache:'no-store'}]
  ];
  for(const [u,o] of tries){
    try{const r=await fetch(u,o);if(r.ok){const j=await r.json();if(j&&j.teams)return j}}catch(_){}
  }
  return null;
}
async function load(manual){
  if(busy)return; busy=true; st.refBusy=true; if(manual){st.refMsg='';} render();
  let msg='';
  const j=await getData(); lastLoad=Date.now();
  if(j){const nuevo=Date.parse(j.u)>Date.parse(S.u); const cambio=JSON.stringify(j.teams.map(t=>t.pts))!==JSON.stringify(S.teams.map(t=>t.pts)); S=j;
    msg=nuevo?(cambio?'Datos nuevos de ESPN.':'Revisado: ESPN no tiene cambios nuevos.'):'Aún no hay lectura nueva del robot (el robot lee ESPN cada ~2 min).';}
  else msg='No pude leer los datos; se muestran los últimos que tenía.';
  busy=false; st.refBusy=false; st.refMsg=manual?msg:''; render();
}
if(typeof document!=='undefined'){
  document.addEventListener('click',e=>{
    const tp=e.target.closest('[data-pl],[data-sw],[data-rd]');
    if(tp&&!e.target.closest('[data-prot]')){
      if(tp.dataset.sw){const [a,d,k]=tp.dataset.sw.split('|');openSheet({t:'sw',a,d,k});}
      else if(tp.dataset.rd){openSheet({t:'rd',n:tp.dataset.rd});}
      else openSheet({t:'pl',n:tp.dataset.pl});
      return;
    }
    const t=e.target.closest('button'); if(!t)return;
    if(t.id==='back'){closeSheet();return}
    if(t.dataset.tab){st.tab=t.dataset.tab;render();window.scrollTo(0,0);}
    else if(t.id==='refresh')load(true);
    else if(t.id==='prev'&&st.di>0){st.di--;render();}
    else if(t.id==='next'&&st.di<days().length-1){st.di++;render();}
    else if(t.dataset.rm){st.rmode=t.dataset.rm;render();}
    else if(t.dataset.mt){st.mt=t.dataset.mt;render();}
    else if(t.dataset.rh){st.rh=t.dataset.rh;renderSheet();}
    else if(t.dataset.view){st.view=t.dataset.view;render();}
    else if(t.dataset.wk){st.wk=t.dataset.wk;render();}
    else if(t.dataset.pos){st.pos=t.dataset.pos;render();}
    else if(t.id==='hide'){st.hide=!st.hide;render();}
    else if(t.dataset.h){st.h=t.dataset.h;render();}
    else if(t.dataset.prot){const n=t.dataset.prot;st.prot.has(n)?st.prot.delete(n):st.prot.add(n);try{localStorage.setItem('leo_prot',JSON.stringify([...st.prot]))}catch(_){}render();}
  });
  document.addEventListener('input',e=>{ if(e.target.id==='rq'){st.q=e.target.value;const r=$('#rres');if(r)r.innerHTML=radarResults();return} if(e.target.id==='dtd'){st.dtd=Number(e.target.value)/100;const v=$('#dtdv');if(v)v.textContent=e.target.value+'%';clearTimeout(window.__dt);window.__dt=setTimeout(render,250);} });
  window.addEventListener('popstate',()=>{if(st.sheet){st.sheetStack=[];st.sheet=null;renderSheet()}});
  let tx=0,ty=0;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(!st.sheet)return;const t=e.changedTouches[0];const dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);if(dx>80&&dy<70&&!e.target.closest('.scroll'))closeSheet()},{passive:true});
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&Date.now()-lastLoad>60000)load(false); });
  setInterval(()=>load(false),3*60*1000);
  const t0=days().indexOf(todayKey()); st.di=Math.max(0,t0);
  render(); load(false).then(()=>{const i=days().indexOf(todayKey());if(i>=0){st.di=i;render();}});
}
</script>

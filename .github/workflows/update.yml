name: Actualizar liga
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fetch_espn.py
      - name: Guardar cambios
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add data.json state.json
          git diff --cached --quiet || (git commit -m "datos $(date -u +%FT%TZ)" && git push)
